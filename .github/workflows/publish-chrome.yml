name: Publish Chrome Web Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: Operation to run
        required: true
        default: status
        type: choice
        options:
          - status
          - publish
      tag:
        description: Existing vX.Y.Z tag (required for publish)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-chrome-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chrome-web-store:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      CHROME_WEB_STORE_PUBLISHER_ID: ${{ vars.CHROME_WEB_STORE_PUBLISHER_ID }}
      CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
      CHROME_UPLOAD_TIMEOUT_MS: ${{ vars.CHROME_UPLOAD_TIMEOUT_MS }}
    steps:
      - name: Resolve operation and checkout ref
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            mode=publish
            tag="$PUSH_TAG"
          else
            mode="$REQUESTED_MODE"
            tag="$REQUESTED_TAG"
          fi

          if [[ "$mode" == "publish" ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "publish requires an existing tag matching vX.Y.Z" >&2
              exit 1
            fi
            checkout_ref="refs/tags/$tag"
          else
            tag=''
            checkout_ref="$GITHUB_SHA"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Verify release tag exists
        if: steps.release.outputs.mode == 'publish'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
            echo "tag does not exist: $RELEASE_TAG" >&2
            exit 1
          }
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)" || {
            echo "checkout is not the requested tag commit: $RELEASE_TAG" >&2
            exit 1
          }

      - name: Setup Node.js for status
        if: steps.release.outputs.mode == 'status'
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Setup pnpm
        if: steps.release.outputs.mode == 'publish'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js with pnpm cache
        if: steps.release.outputs.mode == 'publish'
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        if: steps.release.outputs.mode == 'publish'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.release.outputs.mode == 'publish'
        run: pnpm lint

      - name: Typecheck
        if: steps.release.outputs.mode == 'publish'
        run: pnpm typecheck

      - name: Test (hard timeout 60s)
        if: steps.release.outputs.mode == 'publish'
        run: timeout --signal=TERM --kill-after=10s 60s pnpm test

      - name: Integration test (hard timeout 60s)
        if: steps.release.outputs.mode == 'publish'
        run: timeout --signal=TERM --kill-after=10s 60s pnpm test:integration

      - name: Build
        if: steps.release.outputs.mode == 'publish'
        run: pnpm build

      - name: Create Chrome Web Store ZIP
        if: steps.release.outputs.mode == 'publish'
        run: pnpm zip

      - name: Validate release version and ZIP
        if: steps.release.outputs.mode == 'publish'
        id: package
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(node --input-type=module -e "import packageJson from './package.json' with { type: 'json' }; process.stdout.write(packageJson.version)")"
          expected_tag="v$version"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi

          zip_path=".output/xiaoshuaji-leetcode-review-${version}-chrome.zip"
          node scripts/validate-package.mjs "$zip_path"

          sha256="$(sha256sum "$zip_path" | cut -d ' ' -f 1)"
          commit="$(git rev-parse HEAD)"
          metadata_path=".output/chrome-release-metadata.txt"
          {
            echo "version=$version"
            echo "tag=$RELEASE_TAG"
            echo "commit=$commit"
            echo "zip=$zip_path"
            echo "sha256=$sha256"
          } > "$metadata_path"

          {
            echo '## Chrome Web Store release package'
            echo
            printf '%s\n' "- Version: \`$version\`"
            printf '%s\n' "- Tag: \`$RELEASE_TAG\`"
            printf '%s\n' "- Commit: \`$commit\`"
            printf '%s\n' "- ZIP: \`$zip_path\`"
            printf '%s\n' "- SHA-256: \`$sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "metadata_path=$metadata_path" >> "$GITHUB_OUTPUT"

      - name: Upload reviewed release package
        if: steps.release.outputs.mode == 'publish'
        uses: actions/upload-artifact@v4
        with:
          name: chrome-web-store-${{ steps.package.outputs.version }}
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.metadata_path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false

      - name: Fetch Chrome Web Store status
        if: steps.release.outputs.mode == 'status'
        env:
          CHROME_WEB_STORE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/chrome-web-store.mjs status

      - name: Upload and submit Chrome Web Store package
        if: steps.release.outputs.mode == 'publish'
        env:
          CHROME_WEB_STORE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        run: node scripts/chrome-web-store.mjs publish "$ZIP_PATH"
