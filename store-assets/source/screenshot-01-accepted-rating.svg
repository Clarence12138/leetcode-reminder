  <text x="91" y="220" fill="#25293A" font-size="12" font-weight="700">题目描述</text>
  <text x="91" y="272" fill="#202438" font-size="24" font-weight="700">1. 两数之和</text>
  <rect x="91" y="293" width="45" height="22" rx="11" fill="#E7F7EF"/>
  <text x="113" y="308" text-anchor="middle" fill="#2AA66E" font-size="11">简单</text>
  <text x="91" y="349" fill="#555C72" font-size="14">给定一个整数数组和一个目标值，请你在该数组中</text>
  <text x="91" y="378" fill="#555C72" font-size="14">找出和为目标值的那两个整数，并返回它们的下标。</text>
  <text x="91" y="433" fill="#30364D" font-size="14" font-weight="700">示例</text>
  <rect x="91" y="450" width="476" height="105" rx="10" fill="#F6F7FA"/>
  <text x="109" y="479" fill="#50576B" font-size="13">输入：nums = [2,7,11,15], target = 9</text>
  <text x="109" y="508" fill="#50576B" font-size="13">输出：[0,1]</text>
  <text x="109" y="537" fill="#767C90" font-size="12">解释：nums[0] + nums[1] == 9</text>
  <rect x="91" y="653" width="84" height="28" rx="14" fill="#F1F2F6"/>
  <text x="133" y="672" text-anchor="middle" fill="#666D80" font-size="11">数组</text>
  <rect x="183" y="653" width="84" height="28" rx="14" fill="#F1F2F6"/>
  <text x="225" y="672" text-anchor="middle" fill="#666D80" font-size="11">哈希表</text>

  <rect x="612" y="179" width="604" height="42" fill="#202431"/>
  <text x="635" y="205" fill="#D2D6E3" font-size="12">代码</text>
  <text x="1167" y="205" text-anchor="end" fill="#8C93A8" font-size="11">JavaScript</text>
  <g font-size="14">
    <text x="640" y="260" fill="#8A91A7">1</text><text x="679" y="260" fill="#C792EA">var</text><text x="710" y="260" fill="#82AAFF"> twoSum</text><text x="772" y="260" fill="#C3C8D6"> = </text><text x="792" y="260" fill="#C792EA">function</text><text x="858" y="260" fill="#C3C8D6">(nums, target) {</text>
    <text x="640" y="290" fill="#8A91A7">2</text><text x="698" y="290" fill="#C792EA">const</text><text x="744" y="290" fill="#C3C8D6"> seen = </text><text x="803" y="290" fill="#82AAFF">new</text><text x="832" y="290" fill="#C3C8D6"> Map();</text>
    <text x="640" y="320" fill="#8A91A7">3</text><text x="698" y="320" fill="#C792EA">for</text><text x="726" y="320" fill="#C3C8D6"> (</text><text x="743" y="320" fill="#C792EA">let</text><text x="771" y="320" fill="#C3C8D6"> i = 0; i &lt; nums.length; i++) {</text>
    <text x="640" y="350" fill="#8A91A7">4</text><text x="717" y="350" fill="#C792EA">const</text><text x="763" y="350" fill="#C3C8D6"> rest = target - nums[i];</text>
    <text x="640" y="380" fill="#8A91A7">5</text><text x="717" y="380" fill="#C792EA">if</text><text x="737" y="380" fill="#C3C8D6"> (seen.has(rest)) </text><text x="872" y="380" fill="#C792EA">return</text><text x="920" y="380" fill="#C3C8D6"> [seen.get(rest), i];</text>
    <text x="640" y="410" fill="#8A91A7">6</text><text x="717" y="410" fill="#C3C8D6">seen.set(nums[i], i);</text>
    <text x="640" y="440" fill="#8A91A7">7</text><text x="698" y="440" fill="#C3C8D6">}</text>
    <text x="640" y="470" fill="#8A91A7">8</text><text x="679" y="470" fill="#C3C8D6">};</text>
  </g>
